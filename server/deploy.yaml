apiVersion: apps/v1
kind: Deployment
metadata:
  name: kontainkeeper-server
  labels: { app: kontainkeeper-server }
spec:
  replicas: 1            # SQLite 单实例；扩容请切换 PostgreSQL 并拆分 hub
  selector: { matchLabels: { app: kontainkeeper-server } }
  template:
    metadata:
      labels: { app: kontainkeeper-server }
    spec:
      containers:
        - name: server
          image: registry.example.com/kontainkeeper-server:0.1.0
          ports: [{ containerPort: 8443 }]
          env:
            - name: KK_AGENT_TOKENS
              valueFrom: { secretKeyRef: { name: kontainkeeper, key: agent-tokens } }
            - name: KK_ADMIN_USER
              value: admin
            - name: KK_ADMIN_PASS
              valueFrom: { secretKeyRef: { name: kontainkeeper, key: admin-pass } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8443 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 8443 }
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: kontainkeeper-data }
