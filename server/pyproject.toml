[project]
name = "kk-server"
version = "0.1.0"
description = "KontainKeeper 管理服务端（FastAPI hub + REST API + SQLite store）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
kk-server = "kk_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kk_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/kk_server/web" = "kk_server/web"
