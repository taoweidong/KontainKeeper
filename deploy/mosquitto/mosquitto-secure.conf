# KontainKeeper Mosquitto 2.x —— 鉴权模式（可选加固，叠在 docker-compose.prod.yml 之上）
#
# 与默认 mosquitto.conf 的唯一区别：关闭匿名，启用 password_file + acl_file。
# 双端代码已支持（服务端 KK_MQTT_USERNAME/KK_MQTT_PASSWORD，Agent 同名变量），
# 只差这里的 Broker 侧配置。启用步骤见 docs/deployment.md「启用 MQTT 鉴权」。
#
# 生成密码文件（首次）：
#   docker run --rm -v "$PWD/deploy/mosquitto/auth:/auth" eclipse-mosquitto:2 \
#     mosquitto_passwd -c /auth/passwd kk-server      # 交互输入服务端口令
#   docker run --rm -v "$PWD/deploy/mosquitto/auth:/auth" eclipse-mosquitto:2 \
#     mosquitto_passwd -b /auth/passwd kk-agent <AGENT口令>
#
# 注意：改过 KK_TOPIC_PREFIX 的话，auth/aclfile 里的主题前缀要同步改。

listener 1883

allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/auth/aclfile

# retain 持久化（status 在线/离线帧）
persistence true
persistence_location /mosquitto/data/

# 容器环境打到 stdout，便于 docker logs 收集
log_dest stdout
