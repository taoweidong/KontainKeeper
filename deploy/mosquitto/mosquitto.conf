# KontainKeeper 生产用 Mosquitto 2.x 配置
#
# v3 安全模型（内网可信 + 服务端白名单）：
#   - Broker 匿名开放：Agent 零凭据接入（只需 KK_SERVER 地址），不再维护
#     password_file / aclfile / 逐主机账号；
#   - 接入管控上收到 kk-server：Agent 上行帧携带自报 ip，由 KK_AGENT_IPS
#     白名单校验，白名单外的上报全部拒绝并审计；
#   - 本配置适用于内网可信环境。若需更强边界，请在网络层限制 1883 端口的
#     可达范围（防火墙 / 安全组），这是匿名 Broker 下唯一不可伪造的隔离手段。
#
# 说明：
#   - status 的 retain 持久化：Broker 重启后在线视图无需等一轮心跳/LWT 才恢复。

listener 1883

allow_anonymous true

# retain 持久化（status 在线/离线帧）
persistence true
persistence_location /mosquitto/data/

# 容器环境打到 stdout，便于 docker logs 收集
log_dest stdout
