# KontainKeeper 生产用 Mosquitto 2.x 配置
#
# 安全模型（对应方案 C2 / G1）：
#   - 关闭匿名，所有连接须经 password_file 鉴权；
#   - 用户名即「主机名」：服务端用固定账号 kk-server，Agent 用各自主机名；
#   - ACL 用 pattern 行按用户名展开主题（%u = 认证用户名 = 主机名），
#     一台主机一个用户，不需要为 500 台写 500 段显式 user 配置；
#   - status 的 retain 持久化，Broker 重启后在线视图无需等一轮心跳/LWT 才恢复。
#
# 注意：pattern %u 的展开语义与优先级需在真实 Mosquitto 2.x 上实测确认
# （见 docs/completion-plan-mqtt.md §13）。退路：用 gen-credentials.sh 显式生成 user 段。

listener 1883

allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# retain 持久化（status 在线/离线帧）
persistence true
persistence_location /mosquitto/data/

# 容器环境打到 stdout，便于 docker logs 收集
log_dest stdout
