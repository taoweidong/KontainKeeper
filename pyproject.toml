[project]
name = "kontainkeeper"
version = "0.1.0"
description = "K8S 容器（vscode-server IDE）直连管理：镜像内置 Agent + 管理服务端"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# auto 模式：async def 测试与夹具直接跑，不必每个函数挂 @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
