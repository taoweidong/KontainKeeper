[project]
name = "kontainkeeper"
version = "0.1.0"
description = "K8S 容器（vscode-server IDE）直连管理：镜像内置 Agent + 管理服务端"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
