# KontainKeeper 前端独立部署配置（web/Dockerfile 的 production-stage）。
# 默认部署路径是 kk-server 托管（无需 nginx）；本文件仅在用 nginx 独立托管 dist 时生效。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # history 路由 fallback：非根路径刷新时回落 index.html（hash 路由下无副作用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的静态资源可放心长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
