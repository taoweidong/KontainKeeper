[project]
name = "kk-agent"
# 版本单一真源（QR1128-A9，承接 D1.1）：wheel 元数据直接读 config.AGENT_VER，
# 不再手写静态 version——它曾停在 0.1.0 而真实上报版本已是 0.3.0，第三个真源漂移。
dynamic = ["version"]
description = "KontainKeeper 主机端 Agent（MQTT 上报指标 + 远程命令执行，可编译为单文件二进制并支持自更新）"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "psutil>=7.2.2",
    # A7：日志后端。纯 Python 单包，PyInstaller onefile 友好（无 C 扩展/隐藏 import/资源文件）
    "loguru>=0.7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
kk-agent = "kk_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kk_agent/config.py"
pattern = 'AGENT_VER = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/kk_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
