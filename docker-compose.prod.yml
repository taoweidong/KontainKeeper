# KontainKeeper 生产全栈（匿名 Broker + 服务端 IP 白名单，v3）
#
# 凭据一律走 .env / secret 注入，**切勿写死在仓库里**（本仓库公开，见 .env.example）：
#   cp .env.example .env && 填真实值
#   docker compose -f docker-compose.prod.yml --env-file .env up --build
#
# v3 接入模型：
#   - Broker 匿名开放（Agent 零凭据，仅需 KK_SERVER 地址）；
#   - 接入管控在 kk-server：KK_AGENT_IPS 白名单（逗号分隔 IP/CIDR），
#     白名单外 Agent 的上报全部拒绝并审计；
#   - KK_ENV=production 启动自检：默认 admin 口令或空白名单会直接拒绝启动。

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  kk-server:
    # image 与 build 并存（compose 支持）：手工部署走 build（默认产物标签就是 kk-server:latest，
    # 与 deploy/offline/pack.sh、docker-compose.offline.yml 一致，行为不变）；
    # CI 部署则用 KK_SERVER_IMAGE 指定已推送的镜像标签，配合 `docker compose pull` 免去目标机构建。
    image: ${KK_SERVER_IMAGE:-kk-server:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      KK_MQTT_URL: mqtt://mosquitto:1883
      KK_TOPIC_PREFIX: ${KK_TOPIC_PREFIX:-kk/v1}
      KK_AGENT_IPS: ${KK_AGENT_IPS:?请设置 KK_AGENT_IPS 接入白名单（逗号分隔 IP/CIDR）}
      KK_DB_PATH: /data/kk-server.db
      KK_PORT: "8443"
      KK_HOST: 0.0.0.0
      KK_ADMIN_USER: ${KK_ADMIN_USER:-admin}
      KK_ADMIN_PASS: ${KK_ADMIN_PASS:?请设置强口令 KK_ADMIN_PASS}
      KK_ENV: production
    ports:
      - "8443:8443"
    volumes:
      - kk-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
    # 日志：stdout 由 docker 采集（服务端不再自己维护文件 sink，除非显式设 KK_LOG）。
    # 必须设上限——默认 json-file 驱动不轮转，长跑节点的磁盘会被打满（A7.4）。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mosquitto-data:
  kk-data:
