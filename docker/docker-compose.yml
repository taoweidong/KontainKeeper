# KontainKeeper 一键全栈（开发 / 演示用，开匿名 Broker，开箱即起）
#
# 启动：  docker compose up --build
# 访问：  http://localhost:8443  （服务端单端口托管前端 + REST API）
# Agent： ./kk-agent mqtt://<宿主机IP>:1883   （v3 起仅需服务端地址）
#
# 生产部署：改用 docker-compose.prod.yml（配置 KK_AGENT_IPS 接入白名单）。
#   docker compose -f docker-compose.prod.yml --env-file .env up --build
#
# 说明：kk-server 构建上下文为仓库根（uv workspace，锁在根 uv.lock），
# Dockerfile 在 docker/Dockerfile，.dockerignore 已收敛构建上下文。

services:
  mosquitto:
    # 生产镜像清单不含 eclipse-mosquitto：Broker 统一由 docker/broker/Dockerfile
    # 基于 ubuntu:latest 自建（apt 的 mosquitto 2.0.x），配置/数据卷挂载路径不变。
    image: ${BROKER_IMAGE:-kk-broker:latest}
    build:
      context: .
      dockerfile: docker/broker/Dockerfile
      args:
        UBUNTU_BASE: ${KK_UBUNTU_BASE:-ubuntu:latest}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  kk-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_BASE: ${KK_PYTHON_BASE:-python:3.12}
    # 开发用：匿名 Broker + 未配 KK_AGENT_IPS（白名单为空 = 允许所有上报）
    environment:
      KK_MQTT_URL: mqtt://mosquitto:1883
      KK_TOPIC_PREFIX: kk/v1
      KK_DB_PATH: /data/kk-server.db
      KK_PORT: "8443"
      KK_HOST: 0.0.0.0
    ports:
      - "8443:8443"
    volumes:
      - kk-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
    # 日志走 docker（保留上限，避免长跑打满磁盘）；要落文件就设 KK_LOG
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mosquitto-data:
  kk-data:
